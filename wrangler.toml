main = "src/index.ts"
compatibility_date = "2025-09-01"

# WebSocket compression is on by default from compatibility_date 2023-08-15
# onward. Every byte here is either a sealed dial frame or
# the VPS's own TLS session with the provider - already high entropy, so
# compression buys nothing.
# Complete peer-initiated close handshakes in the runtime, including when the
# VPS abandons a tunnel after rejecting the provider's TLS certificate. Older
# compatibility dates require an explicit opt-in; keep the date unchanged to
# avoid enabling unrelated runtime changes. Application close handlers still
# release TCP resources and enforce limits.
# https://developers.cloudflare.com/workers/observability/errors/
compatibility_flags = ["no_web_socket_compression", "web_socket_auto_reply_to_close"]

# Never turn this on. The app tells users in PrivacyPolicyContent.tsx that this
# component keeps no record of what passes through it; request logs would make
# that claim false. See the header comment in src/index.ts.
logpush = false

# A Worker holding a WebSocket open is billed on CPU time, not wall clock, so
# raising this ceiling costs nothing when it is not reached. Leaving it unset
# means the 30s default, which for a byte pump is a cliff rather than a limit:
# a high-throughput tunnel hits it and the isolate is hard-killed mid-stream
# with no ERROR frame, so the VPS sees only an abrupt close and reports a
# generic failure that points nowhere near the cause. 120s is well inside the
# 5min paid maximum and well past anything DEFAULT_LIMITS in src/pipe.ts allows
# a single tunnel to spend.
[limits]
cpu_ms = 120000

[vars]
# Comma-separated. Each entry is a full origin ("https://inbrowser.tech"), a
# bare host ("inbrowser.tech", any scheme), or a wildcard ("*.inbrowser.tech",
# which covers that host AND anything beneath it - see isOriginAllowed in
# src/dial.ts for why the apex is included rather than excluded).
#
# Empty allows any origin, which is the right default for a self-hosted relay.
# Self-hosters running their own app on their own domain should set it to
# theirs. Note this is a floor, not a boundary: a browser cannot forge Origin
# but any non-browser client can, and a request with no Origin header at all
# is not subject to it. RELAY_SECRET is the control that actually matters.
ALLOWED_ORIGINS = "*.inbrowser.tech"

# RELAY_SECRET is a secret, not a var:
#   openssl rand -hex 32 | npx wrangler secret put RELAY_SECRET
# The same value goes in the VPS relay's environment. Without it, a dial cannot
# be sealed, so a publicly reachable Worker is still not an open relay.

# Per-user, keyed on the opaque bucket carried inside the sealed dial.
#
# This was 60/60s keyed on cf-connecting-ip, which was not a per-user limit at
# all: every dial arrives from the relay's single machine, so it was one budget
# shared by every user of the platform - about one dial per second in total, and
# a single client scanning a proxy list could consume all of it.
#
# 120/60s deliberately MATCHES the relay's own rateLimitPerMinute rather than
# sitting under it. One /v1/fetch produces at most one dial, so the relay's
# limiter is already the user-facing constraint; this one exists as a backstop
# in case that is bypassed, and a tighter value here would only produce
# confusing worker_rate_limited errors for users the relay already admitted.
#
# Cloudflare counts these per location and only eventually consistently, so the
# real ceiling is this number times however many colos the relay reaches. That
# is fine for a backstop and would not be fine for accounting.
[[unsafe.bindings]]
name = "DIAL_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Platform-wide backstop, keyed on a constant.
#
# period = 10 rather than 60 on purpose: `period` may only be 10 or 60, and the
# shorter window is what bounds a BURST. 6000/60s would happily allow all 6000
# in the first second; 1000/10s holds the sustained rate near 100/s, which is
# comfortably above the target and still stops a runaway retry loop turning
# into unbounded Workers spend and unbounded connection attempts against
# whatever proxy happens to be configured.
[[unsafe.bindings]]
name = "GLOBAL_DIAL_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 1000, period = 10 }
